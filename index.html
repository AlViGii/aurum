<script>
const $=s=>document.querySelector(s),f=(x,d=1)=>x==null?'–':x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const cl=x=>Math.max(0,Math.min(100,x)),sc=(x,lo,hi)=>cl((x-lo)/(hi-lo)*100),avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const store={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let W=store.g('w',{q:25,v:20,g:15,t:15,n:15,r:10}),WL=store.g('wl',[]),CMP=[],theme=store.g('th','auto'),sortK='tot',sortD=-1,secF='',qF='';
if(theme!='auto')document.documentElement.dataset.theme=theme;
const WN={q:'Fundamentale Qualität',v:'Aktienbewertung',g:'Wachstum & Zukunft',t:'Technische Analyse',n:'Nachrichten & Makro',r:'Risiken'};
const SECS=['Technologie','Software','Halbleiter','Künstliche Intelligenz','Gesundheit','Biotechnologie','Finanzen','Versicherungen','Industrie','Automobil','Energie','Erneuerbare Energien','Rohstoffe','Konsum','Einzelhandel','Kommunikation','Luftfahrt & Verteidigung','Immobilien'];
const ma=(a,n,i=a.length-1)=>avg(a.slice(i-n+1,i+1));

function volA(a){const r=[];for(let i=a.length-250;i<a.length;i++)r.push(Math.log(a[i]/a[i-1]));const m=avg(r);return Math.sqrt(avg(r.map(x=>(x-m)**2))*252)*100}
const SB_URL='https://edtsbadauyivlkasudua.supabase.co',SB_KEY='sb_publishable_2PYoc6EdrDmclBVqW9BKlg_1yeCep5Q';
let S=[],LOADED=false,ERR='',RAWDBG={};
const nn=x=>x==null?null:+x,A=a=>{a=a.filter(x=>x!=null&&isFinite(x));return a.length?avg(a):null};
async function sb(p){const r=await fetch(SB_URL+'/rest/v1/'+p,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,150));return r.json()}

const qm=Object.fromEntries(qu.map(x=>[x.ticker,x])),mm=Object.fromEntries(me.map(x=>[x.ticker,x])),live=st.filter(x=>qm[x.ticker]&&qm[x.ticker].price!=null);
const pr=await Promise.all(live.map(async x=>{const q='prices?ticker=eq.'+x.ticker+'&order=day.desc&limit=1000&select=';try{return await sb(q+'day,close,volume')}catch(e){return await sb(q+'day,close')}}));
S=live.map((x,i)=>{const q=qm[x.ticker],m=mm[x.ticker]||{},rw=pr[i].reverse(),a=rw.map(r=>+r.close),vs=rw.map(r=>nn(r.volume)),p=+q.price,pc100=v=>v==null?null:v*100;
const o={t:x.ticker,n:x.name,sec:x.sector,c:x.country,p,mc:q.market_cap==null?null:q.market_cap/1e9,chg:nn(q.change_pct),asof:q.as_of,fetched:q.fetched_at,pe:nn(m.pe),peg:nn(m.peg),fcf:pc100(nn(m.fcf_yield)),roic:pc100(nn(m.roic)),debt:nn(m.debt_ebitda),dy:pc100(nn(m.div_yield)),a,fund:fu.filter(r=>r.ticker==x.ticker)};Object.assign(o,gr(o.fund));
if(a.length>=201)Object.assign(o,{d20:p/ma(a,20)-1,d50:p/ma(a,50)-1,d100:p/ma(a,100)-1,d200:p/ma(a,200)-1,rsi:rsi(a)});
if(a.length>=251)o.vol=volA(a);if(a.length>=60){const M=macd(a);o.mh=M.h[a.length-1]/p*100}o.vols=vs;return o});const r6=S.map(s=>s.a.length>126?s.a[s.a.length-1]/s.a[s.a.length-126]-1:null),av=A(r6);S.forEach((s,i)=>s.rs=r6[i]==null||av==null?null:r6[i]-av);refresh()}catch(e){ERR=String(e)}LOADED=true}
const BANKS=['JPM','BAC','WFC','C','GS','MS'];
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map(v=>e=v*k+e*(1-k))};
function macd(a){const e1=ema(a,12),e2=ema(a,26),m=e1.map((v,i)=>v-e2[i]),sg=ema(m,9);return{m,sg,h:m.map((v,i)=>v-sg[i])}}
function boll(a,i=a.length-1,n=20){const w=a.slice(i-n+1,i+1),mu=avg(w),sd=Math.sqrt(avg(w.map(x=>(x-mu)**2)));return{u:mu+2*sd,mid:mu,l:mu-2*sd}}
function zones(a){const N=a.slice(-250),pv=[];for(let i=8;i<N.length-8;i++){const w=N.slice(i-8,i+9);if(N[i]==Math.max(...w)||N[i]==Math.min(...w))pv.push(N[i])}pv.sort((x,y)=>x-y);const z=[];for(const v of pv){const l=z[z.length-1];if(l&&v/l.hi<1.02){l.hi=v;l.n++}else z.push({lo:v,hi:v,n:1})}return z}
function bars(v,col){const N=v.slice(-120).map(x=>x==null?0:x),mx=Math.max(...N.map(Math.abs))||1,w=700/N.length;return`<svg viewBox="0 0 700 80">${N.map((x,i)=>`<rect x="${(i*w).toFixed(1)}" y="${(x>=0?40-x/mx*38:40).toFixed(1)}" width="${(w*.8).toFixed(1)}" height="${(Math.abs(x)/mx*38).toFixed(1)}" fill="${col||(x>=0?'var(--up)':'var(--dn)')}"/>`).join('')}<line x1="0" x2="700" y1="40" y2="40" stroke="var(--ln)"/></svg>`}
function cagr(F,k){const R=F.filter(r=>r[k]!=null&&+r[k]>0).slice(-6);if(R.length<3)return null;const a=+R[0][k],b=+R[R.length-1][k],y=(Date.parse(R[R.length-1].period_end)-Date.parse(R[0].period_end))/31557600000;return y>=2?(Math.pow(b/a,1/y)-1)*100:null}
function gr(F){const l=F[F.length-1],om=l&&l.revenue&&l.operating_income!=null?+l.operating_income/+l.revenue*100:null;return{rg:cagr(F,'revenue'),eg:cagr(F,'net_income'),om}}
function ybars(F,k,title,div,u){const v=F.map(r=>r[k]==null?null:+r[k]/div),ok=v.filter(x=>x!=null);if(ok.length<2)return`<div class="c"><b>${title}</b><p class="mu">keine Daten</p></div>`;const mx=Math.max(...ok.map(Math.abs))||1,w=700/F.length;
return`<div class="c"><b>${title}</b> <span class="mu">${u}</span><svg viewBox="0 0 700 170">${F.map((r,i)=>{const x=v[i];if(x==null)return'';const h=Math.abs(x)/mx*55,y=x>=0?80-h:80,cx=(i*w+w/2).toFixed(1);return`<rect x="${(i*w+w*.15).toFixed(1)}" y="${y.toFixed(1)}" width="${(w*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x>=0?'var(--ac)':'var(--dn)'}"/><text x="${cx}" y="${(x>=0?y-4:y+h+12).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--mu)">${f(x,k=='eps_diluted'?2:1)}</text><text x="${cx}" y="160" text-anchor="middle" font-size="12" fill="var(--mu)">${String(r.period_end).slice(0,4)}</text>`}).join('')}</svg></div>`}
function fundBlock(s){const F=(s.fund||[]).slice(-10);if(F.length<2)return'<h2>Geschäftszahlen (mehrere Jahre)</h2><div class="c"><p class="mu">Noch keine Daten aus SEC EDGAR für diese Aktie. Die Funktion fetch-sec muss einmal ausgeführt werden.</p></div>';
const m=(a,b)=>a!=null&&b?f(+a/+b*100,1)+' %':'–';
return`<h2>Geschäftszahlen (mehrere Jahre)</h2><div class="two">${ybars(F,'revenue','Umsatz',1e9,'Mrd $')}${ybars(F,'net_income','Nettogewinn',1e9,'Mrd $')}${ybars(F,'fcf','Free Cashflow',1e9,'Mrd $')}${ybars(F,'eps_diluted','Gewinn je Aktie (verwässert, nicht um Aktiensplits bereinigt)',1,'$')}</div>
<div class="c sw" style="margin-top:12px"><table><tr><th>Geschäftsjahr bis</th><th>Umsatz Mrd $</th><th>Operative Marge</th><th>Netto-Marge</th><th>FCF-Marge</th></tr>${F.slice(-6).reverse().map(r=>`<tr><td>${r.period_end}</td><td>${r.revenue==null?'–':f(+r.revenue/1e9,1)}</td><td>${m(r.operating_income,r.revenue)}</td><td>${m(r.net_income,r.revenue)}</td><td>${m(r.fcf,r.revenue)}</td></tr>`).join('')}</table></div>
<div class="note">Quelle: SEC EDGAR (Jahresberichte 10-K). Umsatz Ø p. a.: ${s.rg==null?'–':f(s.rg,1)+' %'} · Nettogewinn Ø p. a.: ${s.eg==null?'–':f(s.eg,1)+' %'} (bis zu 5 Jahre, <b>vergangene</b> Entwicklung, keine Prognose). Fehlende Werte sind keine Nullen, die Firma nutzt dafür ggf. andere Berichtsposten.</div>`}
let FA=store.g('fa',{r:8,tg:2.5});
function dcfVal(b0,g,r,tg){let v=0,c=b0;for(let t=1;t<=5;t++){c*=1+g;v+=c/Math.pow(1+r,t)}return v+c*(1+tg)/(r-tg)/Math.pow(1+r,5)}
function impG(b0,sh,price,r,tg){const rr=Math.max(r,tg+.02),T=price*sh;let lo=-.3,hi=.8;if(dcfVal(b0,hi,rr,tg)<T)return{hi:true};if(dcfVal(b0,lo,rr,tg)>T)return{lo:true};for(let i=0;i<60;i++){const m=(lo+hi)/2;if(dcfVal(b0,m,rr,tg)<T)lo=m;else hi=m}return{g:(lo+hi)/2*100}}
function dcf(s){if(BANKS.includes(s.t))return{why:'Bei Banken ist der Free Cashflow nicht aussagekräftig.'};
const F=(s.fund||[]).filter(r=>r.fcf!=null);if(F.length<5)return{why:'Zu wenig Jahre mit Free-Cashflow-Daten (mindestens 5 nötig).'};
const b0=avg(F.slice(-3).map(r=>+r.fcf));if(!(b0>0))return{why:'Der Free Cashflow der letzten drei Jahre ist im Schnitt nicht positiv.'};
if(!s.mc||!s.p)return{why:'Die Marktkapitalisierung fehlt, die Aktienzahl lässt sich nicht ableiten.'};
const sh=s.mc*1e9/s.p,hg=cagr(F,'fcf'),h=hg==null?0:hg,gb=Math.min(12,Math.max(0,.6*h)),tg=FA.tg/100,r0=FA.r/100,out={b0,sh,hg,gb,tg,r0};
for(const[n,g,r]of[['bear',gb*.5,r0+.015],['base',gb,r0],['bull',Math.min(18,gb*1.5),r0-.01]]){const rr=Math.max(r,tg+.02);out[n]=dcfVal(b0,g/100,rr,tg)/sh;out[n+'g']=g;out[n+'r']=rr}out.imp=impG(b0,sh,s.p,r0,tg);return out}
function fairBlock(s){const d=s.fv;if(!d||d.why)return`<h2>Fair Value & Szenarien</h2><div class="c"><b>Nicht berechenbar.</b><p class="mu">${d?d.why:'Keine Daten.'} Es wird nichts geschätzt.</p></div>`;
const rd=x=>f(Math.round(x/5)*5,0),mx=Math.max(d.bull,d.base,d.bear,s.p)*1.1,m=d.base/s.p-1;
const row=(n,v,g,r)=>`<div style="display:flex;justify-content:space-between"><span>${n}</span><b>≈ ${rd(v)} $ <span class="mu">(${v/s.p-1>=0?'+':''}${f((v/s.p-1)*100,0)} % zum Kurs)</span></b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div>`;
const rs=[d.r0-.01,d.r0,d.r0+.01],ts=[d.tg-.005,d.tg,d.tg+.005],fm=o=>o.hi?'mehr als 80 %':o.lo?'weniger als −30 %':f(o.g,1)+' %',I=rs.map(r=>impG(d.b0,d.sh,s.p,r,d.tg));
return`<h2>Fair Value & Szenarien</h2><div class="c">${row('Bear Case',d.bear)}${row('Base Case',d.base)}${row('Bull Case',d.bull)}<div style="display:flex;justify-content:space-between"><span>Aktueller Kurs</span><b>${f(s.p)} $</b></div><div class="bar"><i style="width:${s.p/mx*100}%;background:var(--tx)"></i></div>
<p>Bandbreite: <b>≈ ${rd(d.bear)} bis ${rd(d.bull)} $</b>. Der Base Case liegt ${pc(m,0)} gegenüber dem Kurs. Das ist ein Modell mit Annahmen, keine Prognose.</p></div>
<div class="c sw" style="margin-top:12px"><table><tr><th>Annahme</th><th>Bear</th><th>Base</th><th>Bull</th></tr><tr><td>Free-Cashflow-Wachstum p. a. (5 Jahre)</td><td>${f(d.bearg,1)} %</td><td>${f(d.baseg,1)} %</td><td>${f(d.bullg,1)} %</td></tr><tr><td>Abzinsung</td><td>${f(d.bearr*100,1)} %</td><td>${f(d.baser*100,1)} %</td><td>${f(d.bullr*100,1)} %</td></tr><tr><td>Endwachstum danach</td><td>${f(d.tg*100,1)} %</td><td>${f(d.tg*100,1)} %</td><td>${f(d.tg*100,1)} %</td></tr></table></div>
<div class="c sw" style="margin-top:12px"><b>Empfindlichkeit (Base Case, Wert je Aktie in $)</b><table><tr><th>Abzinsung ↓ / Endwachstum →</th>${ts.map(t=>`<th>${f(t*100,1)} %</th>`).join('')}</tr>${rs.map(r=>`<tr><td>${f(r*100,1)} %</td>${ts.map(t=>`<td>≈ ${rd(dcfVal(d.b0,d.baseg/100,Math.max(r,t+.02),t)/d.sh)}</td>`).join('')}</tr>`).join('')}</table></div>
<div class="c" style="margin-top:12px"><b>Was der Kurs voraussetzt</b><p>Damit der heutige Kurs von ${f(s.p)} $ gerechtfertigt ist, müsste der Free Cashflow bei ${f(d.r0*100,1)} % Abzinsung und ${f(d.tg*100,1)} % Endwachstum <b>fünf Jahre lang um ${I[1].hi||I[1].lo?'':'≈ '}${fm(I[1])} pro Jahr</b> wachsen. Bisher: ${d.hg==null?'nicht ableitbar':f(d.hg,1)+' % p. a.'} (SEC, bis zu 5 Jahre).</p><div class="mu">Bei ${f(rs[0]*100,1)} % Abzinsung: ${fm(I[0])} · bei ${f(rs[2]*100,1)} %: ${fm(I[2])}</div><div class="note">Das sagt nicht, ob die Aktie zu teuer ist. Ob solches Wachstum realistisch ist (neue Produkte, Marktanteile, Preise), musst du einschätzen. Dieser Wert fließt nicht in den Score ein.</div></div>
<div class="note">Rechenweg: Ausgangs-Free-Cashflow = Ø der letzten 3 Geschäftsjahre (${f(d.b0/1e9,1)} Mrd $, SEC EDGAR). Base-Wachstum = 60 % des historischen FCF-Wachstums (${d.hg==null?'nicht ableitbar, 0 % angesetzt':f(d.hg,1)+' % p. a.'}), begrenzt auf 0 bis 12 %. Bear: halbes Wachstum, Abzinsung +1,5 Punkte. Bull: 1,5-faches Wachstum (max. 18 %), Abzinsung −1 Punkt. Vereinfachungen: Nettoverschuldung und Barmittel fehlen, die Aktienzahl ist Marktkapitalisierung ÷ Kurs (${f(d.sh/1e9,2)} Mrd), keine Analystenprognosen. Abzinsung und Endwachstum änderst du in den Einstellungen.</div>`}
function calc(s){const bk=BANKS.includes(s.t),g=(v,f)=>v==null?null:f(v),fv=dcf(s),fvs=fv.base==null?null:sc((fv.base/s.p-1)*100,-60,40),sub={
q:bk?null:A([g(s.roic,v=>sc(v,5,40)),g(s.debt,v=>sc(v,2.5,0)),g(s.om,v=>sc(v,5,40))]),
v:A([g(s.pe,v=>v>0?sc(v,40,10):null),fvs!=null?fvs:(bk?null:g(s.fcf,v=>sc(v,0,5)))]),
g:A([g(s.rg,v=>sc(v,0,25)),g(s.eg,v=>sc(v,0,30))]),
t:s.d200==null?null:A([sc(s.d200*100,-10,20),sc(s.d50*100,-8,12),cl(100-Math.abs(s.rsi-55)*2.5),g(s.mh,v=>sc(v,-1.5,1.5))]),

function chart(s){const N=250,a=s.a.slice(-N),m=n=>s.a.map((_,i)=>i>=n-1?ma(s.a,n,i):null).slice(-N),m50=m(50),m200=m(200),bu=[],bl=[];for(let i=s.a.length-N;i<s.a.length;i++){const b=boll(s.a,i);bu.push(b.u);bl.push(b.l)}const all=[...a,...m50,...m200,...bu,...bl].filter(x=>x!=null),mn=Math.min(...all),mx=Math.max(...all);

function ma200stats(s){const a=s.a,ev=[];let last=-99;for(let i=201;i<a.length-120;i++){const m0=ma(a,200,i-1),m1=ma(a,200,i);if(a[i-1]>=m0&&a[i]<m1&&i-last>20){ev.push(i);last=i}}
